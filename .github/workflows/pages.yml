name: Test ve GitHub Pages yayını

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Varsayılan olarak yalnızca okuma; Pages izinleri sadece deploy işinde.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      # Linux dosya sistemi harf büyüklüğüne duyarlıdır: Windows'ta gözden kaçan
      # path hataları burada yakalanır (npm test, tools/check-paths.js'i de çalıştırır).
      - run: npm test

  deploy:
    # Yalnızca main branch'ine push (ya da main üzerinde elle tetikleme) yayınlar.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # Yalnızca uygulama dosyaları yayınlanır (docs, tests, tools, .claude hariç).
      - name: Yayın klasörünü hazırla
        run: |
          mkdir -p _site
          cp -r index.html css js assets _site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
