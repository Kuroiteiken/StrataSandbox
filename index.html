<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Strata Sandbox</title>
  <meta name="description" content="Tarayıcıda çalışan, grid tabanlı materyal ve fizik sandbox'ı: kum, su, lava, ateş, buhar ve daha fazlası.">
  <meta name="theme-color" content="#14110e">
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./css/base.css">
  <script type="module" src="./js/main.js"></script>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1 class="app-title"><span data-app-name>Strata Sandbox</span></h1>
      <p class="app-subtitle">materyal fiziği</p>
    </header>

    <main class="stage" id="stage">
      <div class="viewport" id="viewport">
        <canvas id="world-canvas" role="img" aria-label="Simülasyon alanı"></canvas>
      </div>
    </main>

    <aside class="panel" id="panel" aria-label="Kontroller">
      <p class="panel-note">Kontroller yapım aşamasında.</p>
    </aside>
  </div>

  <noscript><p class="noscript">Bu uygulama JavaScript gerektirir.</p></noscript>
</body>
</html>
